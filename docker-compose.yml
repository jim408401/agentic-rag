# 全地端環境：向量資料庫 + 業務資料庫（同一個 Postgres）與本地 LLM
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # 有 NVIDIA GPU 時取消註解
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Reranker（Phase 2）：Hugging Face Text Embeddings Inference 的 CPU 版
  # 預設不啟動，需要時執行 docker compose --profile rerank up -d reranker
  # 第一次啟動會從 Hugging Face 下載約 2 GB 的模型，存在 hf_cache volume
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: ["rerank"]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      # 8080 常被其他程式占用，改用 18080；仍衝突時設定環境變數 RERANKER_PORT 換埠，
      # 並把 .env 的 RAG_RERANKER_URL 改成相同的埠
      - "${RERANKER_PORT:-18080}:80"
    volumes:
      - hf_cache:/data
    environment:
      # 公司網路需透過 proxy 才能下載模型時，沿用主機的設定
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

volumes:
  pgdata:
  ollama:
  hf_cache:
