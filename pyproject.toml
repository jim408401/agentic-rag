[project]
name = "agentic-rag"
version = "0.1.0"
description = "從 Naive RAG 一路做到 Agentic RAG 的地端學習專案"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# 解析 PDF / Word / PPT 時再安裝（體積較大）
docling = ["docling>=2.0"]

[project.scripts]
rag = "agentic_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: 需要 Postgres + pgvector（docker compose up -d postgres）",
    "ollama: 需要 Ollama 與已下載的模型",
]
addopts = "-m 'not postgres and not ollama'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 與 Typer 的慣用寫法
extend-immutable-calls = ["fastapi.Depends", "typer.Argument", "typer.Option"]
